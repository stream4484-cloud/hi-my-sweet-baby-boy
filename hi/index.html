<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Website</title>
    <style>
        * {
            box-sizing: border-box;
        }









#black {
  height: 100vh;
  width: 100vw;
  background-color: #111;
}

#dvd {
  position: absolute;
  left: 0px;
  top: 0px;
  height: 50px;
  width: 100px;
  mask: url("https://upload.wikimedia.org/wikipedia/commons/9/9b/DVD_logo.svg");
  -webkit-mask: url("https://upload.wikimedia.org/wikipedia/commons/9/9b/DVD_logo.svg");
  background-repeat: no-repeat;
  background-size: 75px;
  background-position: center;
}















        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            cursor: url('https://www.clker.com/cliparts/m/F/E/0/Q/D/rainbow-mouse-md.png'), auto;
            background-image:
            url("https://i.pinimg.com/originals/94/b5/1a/94b51a221475a4018536f7d153fe9414.gif"),
            linear-gradient(135deg, rgba(0, 0, 0, 0.7), rgba(255, 0, 0, 0.5));
            background-repeat: repeat;
            background-size: 150px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .rainbow-text {
            font-family: Impact, Charcoal, sans-serif;
            font-weight: bold;
            text-align: center;
            font-size: 60px;
            -webkit-text-stroke: 1px black;
            color: #ffffff;
            animation: rainbow-glow 3s linear infinite;
        }

        @keyframes rainbow-glow {
            0% { filter: hue-rotate(0deg); text-shadow: 0 0 10px #ff0000; }
            50% { filter: hue-rotate(180deg); text-shadow: 0 0 20px #00ffff; }
            100% { filter: hue-rotate(360deg); text-shadow: 0 0 10px #ff0000; }
        }
        .section-title-blue {
          color: #0730ff;
            font-size: 55px;
            font-family: Impact, sans-serif;
            text-align: center;
          text-shadow: 0px 0px 0 rgb(2,43,250),
                       1px 1px 0 rgb(-3,38,245),
                       2px 2px 0 rgb(-8,33,240),
                       3px 3px 0 rgb(-13,28,235),
                       4px 4px 0 rgb(-18,23,230),
                       5px 5px 0 rgb(-23,18,225),
                       6px 6px 0 rgb(-28,13,220),
                       7px 7px 0 rgb(-33,8,215),
                       8px 8px 0 rgb(-38,3,210),
                       9px 9px 0 rgb(-43,-2,205),
                       10px 10px  0 rgb(-48,-7,200),
                       11px 11px 10px rgba(0,0,0,0.6),
                       11px 11px 1px rgba(0,0,0,0.5),
                       0px 0px 10px rgba(0,0,0,.2);
       		}
        .section-title-red {
            font-size: 55px;
            color: #ff0707;
            font-family: Impact, sans-serif;
            text-align: center;
            text-shadow: 
                1px 1px 0 #cc0000, 2px 2px 0 #b30000, 3px 3px 0 #990000, 
                4px 4px 0 #800000, 5px 5px 0 #660000, 6px 6px 0 #4d0000, 
                7px 7px 10px rgba(0,0,0,0.8);
        }

        .section-title-green {
            font-size: 55px;
            color: #00ff15;
            font-family: Impact, sans-serif;
            text-align: center;
            text-shadow: 
                1px 1px 0 #00cc11, 2px 2px 0 #00b30f, 3px 3px 0 #00990d, 
                4px 4px 0 #00800b, 5px 5px 0 #006609, 6px 6px 0 #004d07, 
                7px 7px 10px rgba(0,0,0,0.8);
        }

        .fancy-box {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            border: 20px solid transparent;
            border-image: url("https://media.tenor.com/ibiThCO2uW0AAAAM/gokkusagi.gif") 30 round;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .dvd-container {
            position: relative;
            width: 100%;
            height: 250px;
            background: #000000;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 3px inset #666;
        }

        #dvd-logo {
            position: absolute;
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .grid-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            align-items: center;
            justify-items: center;
        }

        .grid-gallery img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .rotate-anim {
            animation: spin 6s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .list-box {
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }


        li {
            margin-bottom: 10px;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="rainbow-text">Welcome to my website!!</div>

    <div class="section-title-red">STUFF I LIKE</div>

    <div class="fancy-box">

        <div class="grid-gallery">
            <img class="rotate-anim" style="Width: 50px" src="https://blob.gifcities.org/gifcities/DKOVUOTX5YK675CEULVSMQA45GHR6XEI.gif" alt="Spinning Star">

            <img src="https://blob.gifcities.org/gifcities/C4DZXRSTHC3IRIZKGPVE7YIAHECQVB72.gif" style="Width: 1500px" alt="Spongebob">
            <img src="https://blob.gifcities.org/gifcities/2VKQHRRYYTSJLBMGK7SWM4QXV4Y2V4JE.gif" alt="Sonic">
            <img src="https://media.tenor.com/LBiJHXadA60AAAAj/minecraft.gif" alt="Minecraft">
        </div>
    </div>

    <div class="section-title-green">STUFF I LIKE TO DO</div>

    <div class="fancy-box list-box">
        <marquee behavior="scroll" direction="right">Things I like to do and stuff:</marquee>
        <ul>
            <li>Digital art / Traditional art</li>
            <li>Play games</li>
            <li>Playtest games</li>
        </ul>
    </div>

    <div class="section-title-blue">SOCIALS</div>

    <div class="fancy-box">
		<ul>
        <a href="https://www.tiktok.com/@stream44484">Tiktok</a>
        </ul>

        </ul>

</html>
